<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel URBANOS</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><div class="wrap nav"><div class="brand"><b>U</b>RBAN<em>OS</em> <small style="font:12px Arial;color:#999">PAINEL</small></div><button id="logout" class="btn ghost hidden">SAIR</button></div></header>
<main>
<section id="loginView" class="wrap login card"><h1>ENTRAR NO PAINEL</h1><p class="small">Use o e-mail e senha do administrador cadastrados no Supabase.</p><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="password" type="password"></div><button id="login" class="btn" style="width:100%">ENTRAR</button><p id="loginMsg" class="small"></p></section>
<section id="appView" class="hidden">
<div class="hero"><div class="wrap"><h1>GERENCIE SUA <span>LOJA</span></h1><p>Cadastre, edite, pause e exclua produtos direto pelo celular.</p></div></div>
<div class="wrap grid">
<section class="card"><h2 id="formTitle">NOVO PRODUTO</h2><div id="status" class="status">Preencha os dados do produto.</div>
<input id="editId" type="hidden">
<div class="field"><label>Nome</label><input id="name" placeholder="Ex.: Oversized Urban Black"></div>
<div class="two"><div class="field"><label>Preço</label><input id="price" type="number" step=".01" placeholder="129.90"></div><div class="field"><label>Preço promocional</label><input id="promo" type="number" step=".01" placeholder="Opcional"></div></div>
<div class="two"><div class="field"><label>Estoque</label><input id="stock" type="number" min="0" value="0"></div><div class="field"><label>Categoria</label><input id="category" value="Camisetas"></div></div>
<div class="field"><label>Tamanhos</label><input id="sizes" value="P,M,G,GG"><div class="small">Separe por vírgula.</div></div>
<div class="field"><label>Descrição</label><textarea id="description"></textarea></div>
<div class="field"><label>Foto do produto</label><input id="image" type="file" accept="image/*"><img id="preview" class="preview hidden" alt="Prévia"></div>
<div class="checks"><label><input id="featured" type="checkbox"> Destaque</label><label><input id="active" type="checkbox" checked> Produto ativo</label></div>
<button id="save" class="btn" style="width:100%">PUBLICAR PRODUTO</button><button id="cancel" class="btn ghost hidden" style="width:100%;margin-top:8px">CANCELAR EDIÇÃO</button>
</section>
<section class="card"><h2>SEUS PRODUTOS</h2><div id="list" class="products"><div class="empty">Carregando...</div></div></section>
</div></section></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const cfg=window.URBANOS_CONFIG, sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);
const $=id=>document.getElementById(id); let products=[];
function msg(t){$("status").textContent=t}
async function session(){const {data}=await sb.auth.getSession(); const on=!!data.session;$("loginView").classList.toggle("hidden",on);$("appView").classList.toggle("hidden",!on);$("logout").classList.toggle("hidden",!on);if(on)load()}
$("login").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("loginMsg").textContent=error?error.message:"Entrando...";if(!error)session()}
$("logout").onclick=async()=>{await sb.auth.signOut();session()}
async function load(){const {data,error}=await sb.from("products").select("*").order("created_at",{ascending:false});if(error){$("list").innerHTML='<div class="empty">'+error.message+'</div>';return}products=data||[];render()}
function render(){if(!products.length){$("list").innerHTML='<div class="empty">Nenhum produto cadastrado ainda.</div>';return}$("list").innerHTML=products.map(p=>`<article class="item"><img class="thumb" src="${p.image_url||''}" alt=""><div><h3>${p.name}</h3><div class="meta">R$ ${Number(p.price).toFixed(2).replace('.',',')} • estoque ${p.stock} • ${p.active?'ativo':'pausado'} ${p.featured?'<span class="pill">DESTAQUE</span>':''}</div></div><div class="actions"><button class="ghost" onclick="editProduct(${p.id})">EDITAR</button><button class="danger" onclick="delProduct(${p.id})">EXCLUIR</button></div></article>`).join("")}
$("image").onchange=e=>{const f=e.target.files[0];if(f){$("preview").src=URL.createObjectURL(f);$("preview").classList.remove("hidden")}}
async function upload(file){if(!file)return "";const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'');const path=`${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const {error}=await sb.storage.from("products").upload(path,file,{cacheControl:"3600",upsert:false});if(error)throw error;return sb.storage.from("products").getPublicUrl(path).data.publicUrl}
$("save").onclick=async()=>{try{msg("Salvando produto...");const id=$("editId").value;const old=id?products.find(p=>String(p.id)===id):null;const file=$("image").files[0];const image_url=file?await upload(file):(old?.image_url||"");const row={name:$("name").value.trim(),price:Number($("price").value),promo_price:$("promo").value?Number($("promo").value):null,stock:Number($("stock").value||0),category:$("category").value.trim(),sizes:$("sizes").value.split(",").map(x=>x.trim()).filter(Boolean),description:$("description").value.trim(),featured:$("featured").checked,active:$("active").checked,image_url};if(!row.name||!Number.isFinite(row.price))throw new Error("Preencha nome e preço.");let q=id?sb.from("products").update(row).eq("id",id):sb.from("products").insert(row);const {error}=await q;if(error)throw error;reset();msg("Produto salvo com sucesso.");await load()}catch(e){msg("Erro: "+e.message)}}
window.editProduct=id=>{const p=products.find(x=>x.id===id);$("editId").value=p.id;$("name").value=p.name;$("price").value=p.price;$("promo").value=p.promo_price||"";$("stock").value=p.stock;$("category").value=p.category||"";$("sizes").value=(p.sizes||[]).join(",");$("description").value=p.description||"";$("featured").checked=p.featured;$("active").checked=p.active;$("formTitle").textContent="EDITAR PRODUTO";$("save").textContent="SALVAR ALTERAÇÕES";$("cancel").classList.remove("hidden");if(p.image_url){$("preview").src=p.image_url;$("preview").classList.remove("hidden")}scrollTo({top:0,behavior:"smooth"})}
window.delProduct=async id=>{if(!confirm("Excluir este produto?"))return;const {error}=await sb.from("products").delete().eq("id",id);if(error)alert(error.message);else load()}
function reset(){$("editId").value="";["name","price","promo","description"].forEach(x=>$(x).value="");$("stock").value=0;$("category").value="Camisetas";$("sizes").value="P,M,G,GG";$("featured").checked=false;$("active").checked=true;$("image").value="";$("preview").classList.add("hidden");$("formTitle").textContent="NOVO PRODUTO";$("save").textContent="PUBLICAR PRODUTO";$("cancel").classList.add("hidden")}
$("cancel").onclick=reset;session();
</script></body></html>
