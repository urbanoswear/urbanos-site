<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel URBANOS</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="site-header"><div class="wrap nav"><div class="brand"><span class="u">U</span>RBAN<span class="os">OS</span> <small style="font:12px Arial;color:#999">PAINEL</small></div><button id="logout" class="cartbtn hidden">SAIR</button></div></header>
<main>
<section id="loginView" class="wrap loginbox admin-card"><h1 class="display">ENTRAR NO PAINEL</h1><p class="msg">Use o e-mail e a senha do administrador criado no Supabase.</p><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="password" type="password"></div><button id="login" class="checkoutbtn">ENTRAR</button><p id="loginMsg" class="msg"></p></section>
<section id="appView" class="hidden admin-page"><div class="wrap"><h1 class="display" style="font-size:52px">GERENCIE SUA <span style="color:var(--orange)">LOJA</span></h1><div class="admin-grid">
<section class="admin-card"><h2 id="formTitle">NOVO PRODUTO</h2><p id="status" class="msg">Preencha os dados abaixo.</p><input id="editId" type="hidden">
<div class="field"><label>Nome</label><input id="name"></div><div class="two"><div class="field"><label>Preço</label><input id="price" type="number" step=".01"></div><div class="field"><label>Preço promocional</label><input id="promo" type="number" step=".01"></div></div>
<div class="two"><div class="field"><label>Estoque</label><input id="stock" type="number" min="0" value="0"></div><div class="field"><label>Categoria</label><input id="category" value="Camisetas"></div></div>
<div class="field"><label>Tamanhos</label><input id="sizes" value="P,M,G,GG"></div><div class="field"><label>Descrição</label><textarea id="description"></textarea></div>
<div class="field"><label>Foto</label><input id="image" type="file" accept="image/*"><img id="preview" class="preview hidden"></div>
<div style="display:flex;gap:15px;flex-wrap:wrap;margin:12px 0"><label><input id="featured" type="checkbox"> Destaque</label><label><input id="active" type="checkbox" checked> Produto ativo</label></div>
<button id="save" class="checkoutbtn">PUBLICAR PRODUTO</button><button id="cancel" class="cartbtn hidden" style="width:100%;margin-top:8px">CANCELAR EDIÇÃO</button></section>
<section class="admin-card"><h2>SEUS PRODUTOS</h2><div id="list"><div class="empty">Carregando...</div></div></section>
</div></div></section>
</main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const cfg=window.URBANOS_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey),$=id=>document.getElementById(id);let products=[];
async function sync(){const {data}=await sb.auth.getSession(),on=!!data.session;$("loginView").classList.toggle("hidden",on);$("appView").classList.toggle("hidden",!on);$("logout").classList.toggle("hidden",!on);if(on)load()}
$("login").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("loginMsg").textContent=error?error.message:"Entrando...";if(!error)sync()}
$("logout").onclick=async()=>{await sb.auth.signOut();sync()}
async function load(){const {data,error}=await sb.from("products").select("*").order("created_at",{ascending:false});if(error){$("list").innerHTML='<div class="empty">'+error.message+'</div>';return}products=data||[];render()}
function render(){$("list").innerHTML=products.length?products.map(p=>`<article class="admin-item"><img class="admin-thumb" src="${p.image_url||''}"><div><h3 style="margin:0">${p.name}</h3><div class="msg">R$ ${Number(p.price).toFixed(2).replace('.',',')} • estoque ${p.stock} • ${p.active?'ativo':'pausado'}</div></div><div class="admin-actions"><button class="ghost" onclick="editP(${p.id})">EDITAR</button><button class="danger" onclick="delP(${p.id})">EXCLUIR</button></div></article>`).join(""):'<div class="empty">Nenhum produto cadastrado.</div>'}
$("image").onchange=e=>{const f=e.target.files[0];if(f){$("preview").src=URL.createObjectURL(f);$("preview").classList.remove("hidden")}}
async function upload(file){if(!file)return "";const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,""),path=`${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const {error}=await sb.storage.from("products").upload(path,file);if(error)throw error;return sb.storage.from("products").getPublicUrl(path).data.publicUrl}
$("save").onclick=async()=>{try{$("status").textContent="Salvando...";const id=$("editId").value,old=id?products.find(p=>String(p.id)===id):null,file=$("image").files[0],image_url=file?await upload(file):(old?.image_url||"");const row={name:$("name").value.trim(),price:Number($("price").value),promo_price:$("promo").value?Number($("promo").value):null,stock:Number($("stock").value||0),category:$("category").value.trim(),sizes:$("sizes").value.split(",").map(x=>x.trim()).filter(Boolean),description:$("description").value.trim(),featured:$("featured").checked,active:$("active").checked,image_url};if(!row.name||!Number.isFinite(row.price))throw Error("Preencha nome e preço.");const {error}=id?await sb.from("products").update(row).eq("id",id):await sb.from("products").insert(row);if(error)throw error;reset();$("status").textContent="Produto salvo com sucesso.";load()}catch(e){$("status").textContent="Erro: "+e.message}}
window.editP=id=>{const p=products.find(x=>x.id===id);$("editId").value=p.id;$("name").value=p.name;$("price").value=p.price;$("promo").value=p.promo_price||"";$("stock").value=p.stock;$("category").value=p.category||"Camisetas";$("sizes").value=(p.sizes||[]).join(",");$("description").value=p.description||"";$("featured").checked=p.featured;$("active").checked=p.active;$("formTitle").textContent="EDITAR PRODUTO";$("save").textContent="SALVAR ALTERAÇÕES";$("cancel").classList.remove("hidden");if(p.image_url){$("preview").src=p.image_url;$("preview").classList.remove("hidden")}scrollTo({top:0,behavior:"smooth"})}
window.delP=async id=>{if(!confirm("Excluir produto?"))return;const {error}=await sb.from("products").delete().eq("id",id);if(error)alert(error.message);else load()}
function reset(){$("editId").value="";["name","price","promo","description"].forEach(x=>$(x).value="");$("stock").value=0;$("category").value="Camisetas";$("sizes").value="P,M,G,GG";$("featured").checked=false;$("active").checked=true;$("image").value="";$("preview").classList.add("hidden");$("formTitle").textContent="NOVO PRODUTO";$("save").textContent="PUBLICAR PRODUTO";$("cancel").classList.add("hidden")}
$("cancel").onclick=reset;sync();
</script></body></html>
