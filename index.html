<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URBANOS</title><link rel="stylesheet" href="styles.css"><style>
.storeHero{padding:65px 0;background:radial-gradient(circle at 15% 20%,#00445b,transparent 28%),radial-gradient(circle at 85% 50%,#602500,transparent 25%),#080a0c}.storeHero h1{font-size:clamp(55px,10vw,105px);line-height:.85;margin:0}.storeHero h1 span{color:var(--orange)}.storeHero p{font-size:19px;color:#c9cdd0}.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:35px 0 70px}.shopcard{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}.shopimg{width:100%;aspect-ratio:4/5;object-fit:cover;background:#080a0c}.shopbody{padding:16px}.shopbody h2{font-size:23px;margin:0 0 8px}.price{font-size:24px;color:var(--blue);font-weight:900}.old{text-decoration:line-through;color:var(--muted);font-size:14px}.stock{font-size:13px;color:var(--muted);margin-top:8px}@media(max-width:760px){.shopgrid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.shopgrid{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div class="wrap nav"><div class="brand"><b>U</b>RBAN<em>OS</em></div><div style="font-weight:900">FRETE GRÁTIS ACIMA DE <span style="color:var(--orange)">R$249,99</span></div></div></header>
<section class="storeHero"><div class="wrap"><h1>CAMISETAS <span>DE PRIMEIRA LINHA</span></h1><p>Oversized com presença, conforto e identidade URBANOS.</p></div></section>
<main class="wrap"><div id="shop" class="shopgrid"><div class="empty">Carregando produtos...</div></div></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const cfg=window.URBANOS_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);
async function load(){const {data,error}=await sb.from("products").select("*").eq("active",true).order("featured",{ascending:false}).order("created_at",{ascending:false});const el=document.getElementById("shop");if(error){el.innerHTML='<div class="empty">Configure o Supabase para carregar o catálogo.</div>';return}if(!data?.length){el.innerHTML='<div class="empty">Novidades chegando. Nenhum produto publicado ainda.</div>';return}el.innerHTML=data.map(p=>`<article class="shopcard"><img class="shopimg" src="${p.image_url||''}" alt="${p.name}"><div class="shopbody"><h2>${p.name}</h2>${p.promo_price?`<div class="old">R$ ${Number(p.price).toFixed(2).replace('.',',')}</div><div class="price">R$ ${Number(p.promo_price).toFixed(2).replace('.',',')}</div>`:`<div class="price">R$ ${Number(p.price).toFixed(2).replace('.',',')}</div>`}<div class="stock">Tamanhos: ${(p.sizes||[]).join(" • ")} · Estoque: ${p.stock}</div><p>${p.description||''}</p></div></article>`).join("")}load();
</script></body></html>
